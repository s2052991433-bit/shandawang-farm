name: Validate Cloudflare build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# Publishing is owned by the existing Cloudflare Workers Git integration.
# This workflow validates the source and never creates another public site.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Check calendar, weather and Worker behavior
        run: node --test tests/farm-calendar.test.mjs tests/farm-weather.test.mjs tests/sites-worker.test.mjs
